services:
  # ==========================================
  # MySQL Database Service
  # ==========================================
  db:
    image: mysql:8.0
    container_name: exam_system_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_password_secure
      MYSQL_DATABASE: school_exam_system
      MYSQL_USER: exam_user
      MYSQL_PASSWORD: ExamSystem@123
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./server/src/config/schema.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "exam_user", "-pExamSystem@123"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - exam_network

  # ==========================================
  # Backend API Service (Node / Express)
  # ==========================================
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: exam_system_server
    restart: unless-stopped
    environment:
      PORT: 5000
      NODE_ENV: production
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: exam_user
      DB_PASSWORD: ExamSystem@123
      DB_NAME: school_exam_system
      JWT_SECRET: production_jwt_super_secret_key_change_me_exam_2026
      JWT_EXPIRES_IN: 24h
      CORS_ORIGIN: http://localhost:3000,http://localhost
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - exam_network

  # ==========================================
  # Frontend Client Service (React SPA / Nginx)
  # ==========================================
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: exam_system_client
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - server
    networks:
      - exam_network

volumes:
  mysql_data:
    driver: local

networks:
  exam_network:
    driver: bridge
